name: e2e · new-agent-v2

# Runs the New-Agent v2 browser e2e (including the in-app voice RECORDING tests)
# on Linux, where Chromium's fake-audio capture pipeline works — those two
# recording tests self-skip on macOS local but run here. The other 3 tests
# (uploader / auto voice source / submit payload / no-overlap) run everywhere.
on:
  push:
    branches: [fix/voice-streaming-latency, feat/new-agent-v2]
  pull_request:
    branches: [feat/new-agent-v2, feat/mobile-pc-parity, main]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start app server
        run: |
          node dist/cli.js --no-open --host 127.0.0.1 > /tmp/pb-server.log 2>&1 &
          echo "PB_PID=$!" >> "$GITHUB_ENV"
          # Wait for the server to accept connections on :3030.
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:3030/m/; then
              echo "server up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "server did not come up; log:"; cat /tmp/pb-server.log; exit 1

      - name: Run new-agent-v2 e2e
        run: npx playwright test new-agent-v2
        env:
          E2E_BASE_URL: http://127.0.0.1:3030

      - name: Server log (on failure)
        if: failure()
        run: cat /tmp/pb-server.log || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
